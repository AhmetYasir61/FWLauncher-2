# /etc/nginx/sites-available/firewing
# Kurulum: sudo ln -s /etc/nginx/sites-available/firewing /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d firewing.store -d www.firewing.store   (ücretsiz HTTPS)
server {
    listen 80;
    server_name firewing.store www.firewing.store;

    root /var/www/firewing;          # web/ klasörünün içeriği buraya kopyalanır
    index index.html index.php;
    client_max_body_size 20m;        # ürün görseli yüklemeleri için

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Gizli ayarlar, loglar ve şema dışarıdan okunamaz.
    location ~ ^/api/(secrets\.php|secrets\.example\.php|fw_secrets\.php|pw_schema\.sql|.*\.log)$ { deny all; }
    location ~ /\. { deny all; }

    # Market adresleri (Apache .htaccess'teki kuralın nginx karşılığı)
    location ~ ^/api/(cosmetic\.json|session|download/.*|tebex/webhook|publish|health)$ {
        rewrite ^/api/(.*)$ /api/market_proxy.php?endpoint=$1&$args last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # PHP sürümüne göre düzenle
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
